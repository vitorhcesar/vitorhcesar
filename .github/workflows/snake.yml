name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Aplicar fundo #0d1117 na versão escura
        run: |
          sudo chown -R "$USER" dist
          python3 - <<'PY'
          import re
          p = "dist/github-contribution-grid-snake-dark.svg"
          s = open(p).read()
          x, y, w, h = re.search(r'viewBox="([^"]+)"', s).group(1).split()
          rect = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" fill="#0d1117"/>'
          s = s.replace("</desc>", "</desc>" + rect, 1)
          open(p, "w").write(s)
          PY

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
